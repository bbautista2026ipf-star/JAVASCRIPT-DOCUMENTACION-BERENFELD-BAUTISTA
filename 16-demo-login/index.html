<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container-fluid vh-100">
      <div class="row d-flex justify-content-center align-items-center h-75">
        <div class="col-sm-12 col-md-6 col-lg-4 col-xl-3 col-xxl-3 mx-auto">
          <form
            action="#"
            id="form-login"
            class="border p-3 rounded-1 shadow w-100 h-100"
          >
            <h3 class="bg-primary text-light text-center p-2 rounded-1">
              Sign in to App
            </h3>
            <!-- Bootstrap Alert -->
            <div id="alert-msg"></div>

            <!-- Fin Bootstrap Alert -->
            <div class="form-group mb-3">
              <input
                type="text"
                class="form-control"
                placeholder="Ingrese su usuario"
                name="user"
                id="user"
              />
            </div>
            <div class="form-group mb-3">
              <input
                type="password"
                class="form-control"
                placeholder="Ingrese su contraseña"
                name="password"
                id="password"
              />
            </div>
            <button class="btn btn-primary w-100" type="submit">Signin</button>
          </form>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
